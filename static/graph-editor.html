<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./graph-editor.css">
</head>
<body>

<div id="app">
  <div id="topbar">
    <div id="brand">graph<span>·</span>editor</div>
    <div id="user-badge">—</div>
    <button id="logout" class="action" title="Создать нового пользователя. Старые графы останутся у прежнего пользователя.">Выйти</button>
    <button id="reload" class="action">Обновить</button>
    <div id="tabs-wrap"><div id="tabs"></div></div>
    <div id="directed-toggle">
      <div class="sw"></div>
      <span id="directed-label">Неориентированный</span>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div id="sidebar-toggle">◂</div>
      <div id="sidebar-content">
        <div class="side-section" id="section-nodes">
          <div class="side-head" data-target="nodes">
            <span>Ноды</span><span class="count" id="nodes-count">0</span>
          </div>
          <div class="side-list" id="nodes-list"></div>
        </div>
        <div class="side-section" id="section-edges">
          <div class="side-head" data-target="edges">
            <span>Связи</span><span class="count" id="edges-count">0</span>
          </div>
          <div class="side-list" id="edges-list"></div>
        </div>
        <div class="side-section" id="section-masks">
          <div class="side-head"><span>Маски · остовные деревья</span><span id="masks-count" class="count">0</span></div>
          <form id="mask-form" class="mask-controls">
            <label>Алгоритм<select id="mask-algorithm"><option value="bfs">BFS</option><option value="dfs">DFS</option><option value="mst">MST</option></select></label>
            <label id="mask-start-label">Имя стартовой ноды<input id="mask-start" type="number" step="1" placeholder="Например, 1" required></label>
            <button class="action" id="mask-create" type="submit">Создать маску</button>
            <button class="action" id="mask-clear" type="button">Снять выделение</button>
            <div class="mask-note" id="mask-note">Маски сохраняют выбранные рёбра и не пересчитываются при изменении графа.</div>
          </form>
          <div class="side-list" id="masks-list"></div>
        </div>
      </div>
    </div>

    <div id="viewport">
      <div id="canvas-stage">
      <div id="canvas">
        <svg id="edge-layer" width="3200" height="2200">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
              <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"></path>
            </marker>
          </defs>
          <g id="edge-lines"></g>
        </svg>
        <div class="empty-canvas-hint" id="empty-hint">Кликните по полю, чтобы создать ноду</div>
      </div>
      </div>
    </div>
    <div id="zoom-controls" role="group" aria-label="Масштаб графа">
      <button id="zoom-out" class="action" aria-label="Отдалить">−</button>
      <button id="zoom-reset" class="action" title="Сбросить масштаб до 100%">100%</button>
      <button id="zoom-in" class="action" aria-label="Приблизить">+</button>
      <button id="view-center" class="action" title="Центр области">В центр</button>
    </div>
  </div>
</div>

<div id="ctx-menu"></div>

<div id="overlay">
  <div id="modal">
    <h3 id="modal-title">Вес связи</h3>
    <input id="modal-input" type="number" step="any">
    <div class="row">
      <button class="cancel" id="modal-cancel">Отмена</button>
      <button class="save" id="modal-save">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="./graph-editor.js"></script>
</body>
</html>
